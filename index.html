<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de série</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/post.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Cadastro de séries</h1>
      <p>Preencha os dados abaixo!!</p>
    </header>
    <main>
      <p><a href="pages/get.html">Ver séries cadastradas</a></p>
      <section>
        <h2>Nova série</h2>

        <form id="form-serie">
          <label for="title">Nome da série:</label>
          <input id="title" type="text" required />

          <label for="genero">Gênero:</label>
          <input id="genero" type="text" required />

          <label for="numero_temporadas">Número de temporadas:</label>
          <input id="numero_temporadas" type="number" required />

          <label for="ano_lancamento">Ano de lançamento:</label>
          <input id="ano_lancamento" type="number" required />

          <label for="plataforma">Plataforma:</label>
          <input id="plataforma" type="text" required />

          <label for="imageUrl">URL da imagem:</label>
          <input id="imageUrl" type="url" />

          <button type="submit">Cadastrar série</button>
        </form>

        <p id="resposta"></p>
      </section>
    </main>
  </body>
</html>
